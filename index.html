<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Satay Supply Dashboard</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .tab-active { background:#fff; color:#b45309; box-shadow:0 1px 2px rgba(0,0,0,.08); }
  .toast { transition: opacity .3s, transform .3s; }
  body[data-role="staff"] .admin-only { display:none !important; }
</style>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b45309">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Satay">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
</head>
<body class="bg-stone-100 text-stone-800 min-h-screen">

<!-- LOGIN (users.json) -->
<div id="login" style="display:flex" class="fixed inset-0 z-40 items-center justify-center bg-gradient-to-br from-amber-700 to-orange-600 p-4">
  <div class="bg-white rounded-2xl shadow-xl p-6 w-full max-w-sm">
    <div class="flex items-start justify-between gap-3">
      <div>
        <img src="icon-192.png" alt="" class="w-12 h-12 rounded-xl mb-3">
        <h1 class="text-xl font-bold" data-i18n="title">Satay Supply Dashboard</h1>
      </div>
      <div class="inline-flex bg-stone-100 rounded-lg p-0.5" id="loginLang" role="group" aria-label="Language">
        <button type="button" data-lang="en" class="px-3 py-1 rounded-md">EN</button>
        <button type="button" data-lang="ms" class="px-3 py-1 rounded-md">BM</button>
      </div>
    </div>
    <form id="loginForm" class="mt-5 space-y-3 text-sm" autocomplete="on">
      <label class="block"><span class="text-stone-500" data-i18n="username">Username</span>
        <input id="lUser" autocomplete="username" autocapitalize="none" class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2"></label>
      <label class="block"><span class="text-stone-500" data-i18n="password">Password</span>
        <input id="lPass" type="password" autocomplete="current-password" class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2"></label>
      <p id="loginErr" style="display:none" class="text-rose-600 text-xs"></p>
      <button id="loginBtn" class="w-full px-4 py-2.5 rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-medium" data-i18n="sign_in">Sign in</button>
    </form>
    <button type="button" id="loginInstall" style="display:none" class="mt-3 w-full px-4 py-2 rounded-lg border border-amber-200 text-amber-700 hover:bg-amber-50 text-sm font-medium" data-i18n="install_phone">Install on this phone</button>
  </div>
</div>

<header class="bg-gradient-to-r from-amber-700 to-orange-600 text-white">
  <div class="max-w-6xl mx-auto px-4 py-5 flex flex-wrap items-center justify-between gap-3">
    <div>
      <h1 class="text-2xl font-bold tracking-tight" data-i18n="title">Satay Supply Dashboard</h1>
      <p class="text-amber-100 text-sm" data-i18n="subtitle">Vendor transactions &amp; payment reconciliation</p>
    </div>
    <div class="flex flex-wrap items-center gap-2 text-sm">
      <div class="inline-flex bg-white/15 rounded-lg p-0.5" id="langSwitch" role="group" aria-label="Language">
        <button data-lang="en" class="px-3 py-1 rounded-md font-medium">EN</button>
        <button data-lang="ms" class="px-3 py-1 rounded-md font-medium">BM</button>
      </div>
      <button type="button" id="btnInstall" class="px-3 py-1.5 rounded-lg bg-white text-amber-700 font-medium" style="display:none" data-i18n="install">Install app</button>
      <button type="button" id="syncChip" class="text-xs px-2 py-1 rounded-full bg-white/15" style="display:none"></button>
      <span id="userChip" class="text-amber-100 hidden sm:inline"></span>
      <button id="btnExport" class="px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25" data-i18n="export">Export CSV</button>
      <button id="btnReset" class="admin-only px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25" data-i18n="clear">Clear all data</button>
      <button id="btnLogout" class="px-3 py-1.5 rounded-lg bg-white/15 hover:bg-white/25" data-i18n="logout">Sign out</button>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

  <section class="grid grid-cols-1 sm:grid-cols-3 gap-4" id="metrics"></section>

  <nav class="inline-flex bg-stone-200 rounded-xl p-1 text-sm font-medium" id="tabs">
    <button data-tab="overview" class="tab px-4 py-2 rounded-lg" data-i18n="tab_overview">Overview</button>
    <button data-tab="transactions" class="tab px-4 py-2 rounded-lg" data-i18n="tab_tx">Transactions</button>
    <button data-tab="payments" class="tab px-4 py-2 rounded-lg" data-i18n="tab_pay">Payments</button>
  </nav>

  <!-- OVERVIEW -->
  <section id="tab-overview" class="space-y-6">
    <div class="bg-white rounded-2xl shadow-sm p-5">
      <h2 class="font-semibold mb-3" data-i18n="outstanding">Outstanding by vendor</h2>
      <div id="ovVendors" class="space-y-2 text-sm"></div>
    </div>
    <div class="bg-white rounded-2xl shadow-sm p-5">
      <h2 class="font-semibold mb-3" data-i18n="latest">Latest transactions</h2>
      <div class="overflow-x-auto"><table class="w-full text-sm" id="ovRecent"></table></div>
    </div>
  </section>

  <!-- TRANSACTIONS -->
  <section id="tab-transactions" class="hidden space-y-6">
    <div class="bg-white rounded-2xl shadow-sm p-5">
      <h2 class="font-semibold mb-4" data-i18n="record">Record a transaction</h2>
      <form id="txForm" class="grid sm:grid-cols-2 lg:grid-cols-4 gap-4 text-sm">
        <label class="block"><span class="text-stone-500" data-i18n="date">Date</span>
          <input type="date" id="fDate" required class="mt-1 w-full rounded-lg border-stone-300 border px-3 py-2"></label>
        <label class="block"><span class="text-stone-500" data-i18n="type">Type</span>
          <select id="fType" class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2">
            <option value="purchase" data-i18n="type_purchase">Purchase Raw Material</option>
            <option value="resell" data-i18n="type_resell">Re-sell Satay</option>
          </select></label>
        <label class="block"><span class="text-stone-500" id="fVendorLabel">Supplier name</span>
          <input type="text" id="fVendor" required list="vendorList" class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2">
          <datalist id="vendorList"></datalist></label>
        <label class="block hidden" id="fDoWrap"><span class="text-stone-500" data-i18n="do_no">DO number</span>
          <input type="text" id="fDo" autocomplete="off" data-i18n-ph="do_ph" placeholder="e.g. DO-0001" class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2"></label>
        <label class="block"><span class="text-stone-500" data-i18n="item">Item</span>
          <select id="fItem" class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2"></select></label>
        <label class="block"><span class="text-stone-500"><span data-i18n="quantity">Quantity</span> <span id="fUnit" class="text-stone-400"></span></span>
          <input type="number" id="fQty" min="0.01" step="any" required class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2"></label>
        <label class="block"><span class="text-stone-500" data-i18n="unit_price">Unit price (RM)</span>
          <input type="number" id="fPrice" min="0" step="any" required class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2"></label>
        <label class="block"><span class="text-stone-500" data-i18n="total_rm">Total (RM)</span>
          <input type="text" id="fTotal" readonly value="0.00" class="mt-1 w-full rounded-lg border border-stone-200 bg-stone-50 px-3 py-2 font-semibold"></label>
        <label class="block"><span class="text-stone-500" data-i18n="pay_status">Payment status</span>
          <select id="fPaid" class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2">
            <option value="pending" data-i18n="opt_pending">Pending</option>
            <option value="paid" data-i18n="opt_settled">Already settled</option>
          </select></label>
        <div class="sm:col-span-2 lg:col-span-4 flex justify-end">
          <button class="px-5 py-2.5 rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-medium" data-i18n="add">Add transaction</button>
        </div>
      </form>
    </div>

    <div class="bg-white rounded-2xl shadow-sm p-5">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
        <h2 class="font-semibold" data-i18n="all_tx">All transactions</h2>
        <input id="txSearch" type="search" data-i18n-ph="search_ph" placeholder="Search vendor or item…" class="rounded-lg border border-stone-300 px-3 py-1.5 text-sm w-60">
      </div>
      <div class="overflow-x-auto"><table class="w-full text-sm" id="txTable"></table></div>
    </div>
  </section>

  <!-- PAYMENTS -->
  <section id="tab-payments" class="hidden space-y-4">
    <div class="bg-white rounded-2xl shadow-sm p-5">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 class="font-semibold" data-i18n="ledger">Payment &amp; reconciliation ledger</h2>
        <div class="flex flex-wrap gap-3 text-sm">
          <div class="inline-flex bg-stone-100 rounded-lg p-1" id="statusFilter">
            <button data-v="all" class="px-3 py-1 rounded-md" data-i18n="f_any">Any status</button>
            <button data-v="pending" class="px-3 py-1 rounded-md" data-i18n="f_pending">Pending</button>
            <button data-v="paid" class="px-3 py-1 rounded-md" data-i18n="f_paid">Paid</button>
          </div>
        </div>
      </div>
      <div class="overflow-x-auto"><table class="w-full text-sm" id="payTable"></table></div>
      <p id="payFooter" class="text-sm text-stone-500 mt-3"></p>
    </div>
  </section>

</main>

<div id="modal" style="display:none" class="fixed inset-0 z-50 items-center justify-center bg-black/40 p-4">
  <div class="bg-white rounded-2xl shadow-xl p-5 w-full max-w-sm" role="dialog" aria-modal="true">
    <p id="modalMsg" class="text-sm text-stone-700"></p>
    <div id="modalPassWrap" style="display:none" class="mt-3">
      <input id="modalPass" type="password" autocomplete="current-password" data-i18n-ph="admin_pw_ph" placeholder="Admin password" class="w-full rounded-lg border border-stone-300 px-3 py-2 text-sm">
      <p id="modalErr" style="display:none" class="text-rose-600 text-xs mt-1"></p>
    </div>
    <div class="mt-5 flex justify-end gap-2 text-sm">
      <button type="button" id="modalNo" class="px-4 py-2 rounded-lg bg-stone-100 hover:bg-stone-200" data-i18n="cancel">Cancel</button>
      <button type="button" id="modalYes" class="px-4 py-2 rounded-lg bg-rose-600 hover:bg-rose-700 text-white font-medium"></button>
    </div>
  </div>
</div>
<div id="ghModal" style="display:none" class="fixed inset-0 z-50 items-center justify-center bg-black/40 p-4">
  <div class="bg-white rounded-2xl shadow-xl p-5 w-full max-w-md max-h-full overflow-y-auto" role="dialog" aria-modal="true">
    <h2 class="font-semibold text-lg" data-i18n="gh_title">Connect to GitHub</h2>
    <p class="text-xs text-stone-500 mt-1" data-i18n="gh_help"></p>
    <div class="mt-4 space-y-3 text-sm">
      <label class="block"><span class="text-stone-500" data-i18n="gh_repo">Data repository (owner/name)</span>
        <input id="ghRepo" autocomplete="off" autocapitalize="none" placeholder="owner/satay-data" class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2"></label>
      <div class="grid grid-cols-2 gap-3">
        <label class="block"><span class="text-stone-500" data-i18n="gh_branch">Branch (optional)</span>
          <input id="ghBranch" autocomplete="off" autocapitalize="none" placeholder="main" class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2"></label>
        <label class="block"><span class="text-stone-500" data-i18n="gh_path">File</span>
          <input id="ghPath" autocomplete="off" autocapitalize="none" placeholder="data.json" class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2"></label>
      </div>
      <label class="block"><span class="text-stone-500" data-i18n="gh_token">Access token</span>
        <input id="ghToken" type="password" autocomplete="off" placeholder="github_pat_..." class="mt-1 w-full rounded-lg border border-stone-300 px-3 py-2"></label>
      <p class="text-xs text-stone-400" data-i18n="gh_token_note"></p>
      <p id="ghErr" style="display:none" class="text-rose-600 text-xs"></p>
    </div>
    <div class="mt-5 flex flex-wrap justify-between gap-2 text-sm">
      <button type="button" id="ghOff" class="px-3 py-2 rounded-lg text-rose-600 hover:bg-rose-50" data-i18n="gh_disconnect">Disconnect</button>
      <div class="flex gap-2">
        <button type="button" id="ghClose" class="px-4 py-2 rounded-lg bg-stone-100 hover:bg-stone-200" data-i18n="close">Close</button>
        <button type="button" id="ghSave" class="px-4 py-2 rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-medium" data-i18n="gh_save">Save &amp; connect</button>
      </div>
    </div>
  </div>
</div>
<div id="installModal" style="display:none" class="fixed inset-0 z-50 items-center justify-center bg-black/40 p-4">
  <div class="bg-white rounded-2xl shadow-xl p-5 w-full max-w-md max-h-full overflow-y-auto" role="dialog" aria-modal="true">
    <h2 class="font-semibold text-lg" data-i18n="inst_title">Install the app</h2>
    <div id="installBody" class="mt-3 space-y-3 text-sm text-stone-700"></div>
    <div class="mt-5 flex justify-end text-sm">
      <button type="button" id="installClose" class="px-4 py-2 rounded-lg bg-amber-600 hover:bg-amber-700 text-white font-medium" data-i18n="close">Close</button>
    </div>
  </div>
</div>
<div id="toast" class="toast fixed bottom-5 left-1/2 -translate-x-1/2 bg-stone-900 text-white text-sm px-4 py-2 rounded-lg opacity-0 pointer-events-none"></div>

      locale: 'ms-MY'

  };

  const LANG_KEY = 'satay-dashboard-lang';
  let lang = 'en';
  try {
    const saved = localStorage.getItem(LANG_KEY);
    if (saved && I18N[saved]) lang = saved;
    else if ((navigator.language || '').toLowerCase().startsWith('ms')) lang = 'ms';
  } catch (e) {}
  const t = k => I18N[lang][k];

  // ---------- Config ----------
  const ITEMS = [
    { name: 'Beef Topside',  kind: 'raw',      unit: 'kg' },
    { name: 'Chicken Chop',  kind: 'raw',      unit: 'kg' },
    { name: 'Satay Ayam',    kind: 'finished', unit: 'sticks' },
    { name: 'Satay Daging',  kind: 'finished', unit: 'sticks' },
  ];
  const BY_NAME = Object.fromEntries(ITEMS.map(i => [i.name, i]));
  const unitLabel = name => t('u_' + BY_NAME[name].unit);
  const CACHE_KEY = 'satay-cache-v3', GH_KEY = 'satay-gh', SESSION_KEY = 'satay-session';
  const OLD_KEY = 'satay-dashboard-v2', MIGRATED_KEY = 'satay-migrated';
  const POLL_MS = 10000;

  // ---------- State ----------
  // All data lives in data.json on GitHub. This is only the copy currently on screen (rev = the file's version on GitHub).
  let state = { tx: [], rev: -1 };
  let ui = { tab: 'overview', status: 'all', q: '' };
  let gh = null, ghDefaults = { repo: '', branch: '', path: 'data.json' }, etag = null, syncErr = '', session = null, online = true;

  const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const lsDel = k => { try { localStorage.removeItem(k); } catch (e) {} };

  function today() {
    const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
    return d.toISOString().slice(0, 10);
  }

  // ---------- Helpers ----------
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const rm = n => 'RM ' + Number(n).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const num = n => Number(n).toLocaleString('en-MY', { maximumFractionDigits: 2 });
  const total = x => Math.round(x.qty * x.price * 100) / 100;
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const fmtDate = d => new Date(d + 'T00:00:00').toLocaleDateString(t('locale'), { day: '2-digit', month: 'short', year: 'numeric' });

  function toast(msg) {
    const el = $('#toast'); el.textContent = msg;
    el.style.opacity = 1; el.style.transform = 'translate(-50%,0)';
    clearTimeout(toast.t);
    toast.t = setTimeout(() => { el.style.opacity = 0; }, 2200);
  }

  const badge = x => x.status === 'paid'
    ? `<span class="px-2 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700">${x.type === 'resell' ? t('b_received') : t('b_paid')}</span>`
    : `<span class="px-2 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-700">${x.type === 'resell' ? t('b_toreceive') : t('b_unpaid')}</span>`;

  const doText = x => x.doNo ? esc(x.doNo) : '<span class="text-stone-300">—</span>';
  const statusSelect = x => {
    const [pendingLbl, paidLbl] = x.type === 'resell' ? [t('b_toreceive'), t('b_received')] : [t('b_unpaid'), t('b_paid')];
    const cls = x.status === 'paid' ? 'bg-emerald-100 text-emerald-700 border-emerald-200' : 'bg-amber-100 text-amber-700 border-amber-200';
    return `<select data-status="${x.id}" class="rounded-full border px-3 py-1 text-xs font-medium cursor-pointer ${cls}">
      <option value="pending" ${x.status === 'pending' ? 'selected' : ''}>${pendingLbl}</option>
      <option value="paid" ${x.status === 'paid' ? 'selected' : ''}>${paidLbl}</option>
    </select>`;
  };
  const typeBadge = x => x.type === 'purchase'
    ? `<span class="px-2 py-0.5 rounded-full text-xs font-medium bg-sky-100 text-sky-700">${t('t_purchase')}</span>`
    : `<span class="px-2 py-0.5 rounded-full text-xs font-medium bg-violet-100 text-violet-700">${t('t_resell')}</span>`;

  const th = cols => `<thead><tr class="text-left text-stone-500 border-b border-stone-200">${cols.map(c => `<th class="py-2 pr-4 font-medium whitespace-nowrap ${c.r ? 'text-right' : ''}">${c.t}</th>`).join('')}</tr></thead>`;
  const sorted = () => [...state.tx].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const empty = (cols, msg) => `<tbody><tr><td colspan="${cols}" class="py-8 text-center text-stone-400">${msg}</td></tr></tbody>`;

  // ---------- Renders ----------
  function renderMetrics() {
    const recv = state.tx.filter(x => x.type === 'resell' && x.status === 'pending').reduce((s, x) => s + total(x), 0);
    const owed = state.tx.filter(x => x.type === 'purchase' && x.status === 'pending').reduce((s, x) => s + total(x), 0);
    const net = recv - owed;
    const card = (label, val, sub, color) => `
      <div class="bg-white rounded-2xl shadow-sm p-4 border-l-4 ${color}">
        <div class="text-xs uppercase tracking-wide text-stone-500">${label}</div>
        <div class="text-xl sm:text-2xl font-bold mt-1">${val}</div>
        <div class="text-xs text-stone-400 mt-1">${sub}</div>
      </div>`;
    $('#metrics').innerHTML =
      card(t('m_recv'), rm(recv), t('m_recv_sub'), 'border-emerald-500') +
      card(t('m_owed'), rm(owed), t('m_owed_sub'), 'border-rose-500') +
      card(t('m_net'), (net >= 0 ? '+' : '−') + rm(Math.abs(net)), t('m_net_sub'), net >= 0 ? 'border-emerald-500' : 'border-rose-500');
  }

  function renderOverview() {
    const map = {};
    state.tx.filter(x => x.status === 'pending').forEach(x => {
      const v = map[x.vendor] ||= { recv: 0, owed: 0 };
      if (x.type === 'resell') v.recv += total(x); else v.owed += total(x);
    });
    const rows = Object.entries(map).sort((a, b) => (b[1].recv + b[1].owed) - (a[1].recv + a[1].owed));
    $('#ovVendors').innerHTML = rows.length ? rows.map(([n, v]) => `
      <div class="flex justify-between items-center border-b border-stone-100 pb-2">
        <span class="font-medium">${esc(n)}</span>
        <span class="text-right">
          ${v.recv ? `<span class="text-emerald-600">+${rm(v.recv)}</span>` : ''}
          ${v.recv && v.owed ? ' · ' : ''}
          ${v.owed ? `<span class="text-rose-600">−${rm(v.owed)}</span>` : ''}
        </span></div>`).join('') : `<p class="text-stone-400">${t('none_out')}</p>`;

    const cols = [{t:t('c_date')},{t:t('c_vendor')},{t:t('c_item')},{t:t('c_type')},{t:t('c_total'),r:1},{t:t('c_status')}];
    const recent = sorted().slice(0, 5);
    $('#ovRecent').innerHTML = th(cols) + (recent.length ? `<tbody>${recent.map(x => `
      <tr class="border-b border-stone-100"><td class="py-2 pr-4 whitespace-nowrap">${fmtDate(x.date)}</td><td class="pr-4">${esc(x.vendor)}</td>
      <td class="pr-4">${x.item}</td><td class="pr-4">${typeBadge(x)}</td><td class="pr-4 text-right">${rm(total(x))}</td><td>${badge(x)}</td></tr>`).join('')}</tbody>` : empty(6, t('no_tx')));
  }

  function renderTx() {
    const q = ui.q.toLowerCase();
    const list = sorted().filter(x => !q || x.vendor.toLowerCase().includes(q) || x.item.toLowerCase().includes(q) || (x.doNo || '').toLowerCase().includes(q));
    const cols = [{t:t('c_date')},{t:t('c_vendor')},{t:t('c_do')},{t:t('c_item')},{t:t('c_type')},{t:t('c_qty'),r:1},{t:t('c_unit'),r:1},{t:t('c_total'),r:1},{t:t('c_status')},{t:''}];
    $('#txTable').innerHTML = th(cols) + (list.length ? `<tbody>${list.map(x => `
      <tr class="border-b border-stone-100 hover:bg-stone-50">
        <td class="py-2 pr-4 whitespace-nowrap">${fmtDate(x.date)}</td>
        <td class="pr-4">${esc(x.vendor)}</td>
        <td class="pr-4">${x.type === 'resell'
          ? `<input data-do="${x.id}" value="${esc(x.doNo || '')}" placeholder="${t('do_ph')}" class="w-28 rounded-md border border-stone-200 px-2 py-1 text-xs">`
          : doText(x)}</td>
        <td class="pr-4">${x.item}</td><td class="pr-4">${typeBadge(x)}</td>
        <td class="pr-4 text-right whitespace-nowrap">${num(x.qty)} ${unitLabel(x.item)}</td>
        <td class="pr-4 text-right">${rm(x.price)}</td>
        <td class="pr-4 text-right font-semibold">${rm(total(x))}</td>
        <td class="pr-4">${statusSelect(x)}</td>
        <td class="text-right"><button data-del="${x.id}" class="admin-only text-stone-400 hover:text-rose-600" title="${t('del')}">✕</button></td>
      </tr>`).join('')}</tbody>` : empty(10, t('no_match')));
  }

  function renderPayments() {
    $$('#statusFilter button').forEach(b => b.className = 'px-3 py-1 rounded-md ' + (b.dataset.v === ui.status ? 'bg-white shadow-sm text-amber-700 font-medium' : 'text-stone-500'));
    const list = sorted().filter(x => ui.status === 'all' || x.status === ui.status);
    const cols = [{t:t('c_date')},{t:t('c_status_click')},{t:t('c_vendor')},{t:t('c_do')},{t:t('c_item')},{t:t('c_amount'),r:1}];
    $('#payTable').innerHTML = th(cols) + (list.length ? `<tbody>${list.map(x => `
      <tr class="border-b border-stone-100 hover:bg-stone-50">
        <td class="py-2.5 pr-4 whitespace-nowrap">${fmtDate(x.date)}</td>
        <td class="pr-4">${statusSelect(x)}</td>
        <td class="pr-4">${esc(x.vendor)}</td><td class="pr-4 whitespace-nowrap">${doText(x)}</td><td class="pr-4">${x.item} <span class="text-stone-400">× ${num(x.qty)}</span></td>
        <td class="pr-4 text-right font-semibold">${rm(total(x))}</td>
      </tr>`).join('')}</tbody>` : empty(6, t('no_match_filter')));
    const sum = list.reduce((s, x) => s + total(x), 0);
    $('#payFooter').textContent = t('footer')(list.length, rm(sum));
  }

  function renderAll() {
    renderMetrics(); renderOverview(); renderTx(); renderPayments();
    $('#vendorList').innerHTML = [...new Set(state.tx.map(x => x.vendor))].map(v => `<option value="${esc(v)}">`).join('');
  }

  function setTab(tab) {
    ui.tab = tab;
    ['overview', 'transactions', 'payments'].forEach(n => $('#tab-' + n).classList.toggle('hidden', n !== tab));
    $$('#tabs .tab').forEach(b => b.className = 'tab px-4 py-2 rounded-lg ' + (b.dataset.tab === tab ? 'tab-active' : 'text-stone-600'));
  }

  // ---------- Form logic ----------
  function syncForm() {
    const type = $('#fType').value;
    const cur = $('#fItem').value;
    const items = ITEMS.filter(i => type === 'purchase' ? i.kind === 'raw' : i.kind === 'finished');
    $('#fItem').innerHTML = items.map(i => `<option>${i.name}</option>`).join('');
    if (items.some(i => i.name === cur)) $('#fItem').value = cur;
    $('#fDoWrap').classList.toggle('hidden', type !== 'resell');
    $('#fVendorLabel').textContent = type === 'purchase' ? t('supplier_name') : t('client_name');
    $('#fUnit').textContent = '(' + unitLabel($('#fItem').value) + ')';
    updateTotal();
  }
  function updateTotal() {
    $('#fTotal').value = (Math.round((+$('#fQty').value || 0) * (+$('#fPrice').value || 0) * 100) / 100).toFixed(2);
  }

  // ---------- Language ----------
  function applyLang() {
    document.documentElement.lang = lang;
    document.title = t('title');
    $$('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    $$('[data-i18n-ph]').forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    $$('#langSwitch button').forEach(b => {
      const on = b.dataset.lang === lang;
      b.className = 'px-3 py-1 rounded-md font-medium ' + (on ? 'bg-white text-amber-700 shadow-sm' : 'text-white/90 hover:bg-white/10');
      b.setAttribute('aria-pressed', on);
    });
    $$('#loginLang button').forEach(b => {
      const on = b.dataset.lang === lang;
      b.className = 'px-3 py-1 rounded-md text-xs font-medium ' + (on ? 'bg-amber-600 text-white' : 'text-stone-500 hover:bg-stone-100');
    });
    refreshChip();
    syncForm(); renderAll();
  }

  // ---------- In-page confirm dialog (native confirm() is blocked in some embedded views) ----------
  let pendingConfirm = null, pendingCancel = null, pendingNeedsPass = false;
  function closeConfirm() {
    $('#modal').style.display = 'none'; $('#modalPassWrap').style.display = 'none';
    $('#modalPass').value = ''; $('#modalErr').style.display = 'none';
    pendingConfirm = null; pendingCancel = null; pendingNeedsPass = false;
  }
  function cancelConfirm() { const c = pendingCancel; closeConfirm(); if (c) c(); }
  // onOk(password) may be async; with needsAdminPassword the dialog stays open until the server accepts the password.
  function askConfirm(msg, okLabel, onOk, needsAdminPassword, onCancel) {
    $('#modalMsg').textContent = msg; $('#modalYes').textContent = okLabel;
    pendingConfirm = onOk; pendingCancel = onCancel || null; pendingNeedsPass = !!needsAdminPassword;
    $('#modalPass').value = ''; $('#modalErr').style.display = 'none';
    $('#modalPassWrap').style.display = pendingNeedsPass ? 'block' : 'none';
    $('#modal').style.display = 'flex';
    (pendingNeedsPass ? $('#modalPass') : $('#modalNo')).focus();
  }
  $('#modalYes').addEventListener('click', async () => {
    const cb = pendingConfirm; if (!cb) return;
    if (!pendingNeedsPass) { pendingCancel = null; closeConfirm(); await cb(); return; }
    const err = $('#modalErr'), btn = $('#modalYes'), pw = $('#modalPass').value;
    err.style.display = 'none';
    if (!pw) { err.textContent = t('admin_pw_wrong'); err.style.display = 'block'; return; }
    btn.disabled = true;
    try { await cb(pw); pendingCancel = null; closeConfirm(); }
    catch (e) {
      err.textContent = e.code === 'bad_password' ? t('admin_pw_wrong') : e.code === 'too_many' ? t('login_limit') : errText(e);
      err.style.display = 'block';
      if (e.code === 'bad_password') $('#modalPass').select();
    } finally { btn.disabled = false; }
  });
  $('#modalPass').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('#modalYes').click(); } });
  $('#modalNo').addEventListener('click', cancelConfirm);
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') cancelConfirm(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && pendingConfirm) cancelConfirm(); });

  // ---------- Events ----------
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-lang]'); if (!b || b.dataset.lang === lang) return;
    lang = b.dataset.lang;
    try { localStorage.setItem(LANG_KEY, lang); } catch (err) {}
    applyLang();
  });
  $('#tabs').addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
  $('#fType').addEventListener('change', syncForm);
  $('#fItem').addEventListener('change', syncForm);
  $('#fQty').addEventListener('input', updateTotal);
  $('#fPrice').addEventListener('input', updateTotal);
  $('#txSearch').addEventListener('input', e => { ui.q = e.target.value; renderTx(); });
  document.addEventListener('change', e => {
    const d = e.target.closest('[data-do]');
    if (d) return void updateTx(d.dataset.do, { doNo: d.value.trim() });
    const s = e.target.closest('[data-status]');
    if (s) updateTx(s.dataset.status, { status: s.value });
  });
  $('#statusFilter').addEventListener('click', e => { const b = e.target.closest('[data-v]'); if (b) { ui.status = b.dataset.v; renderPayments(); } });

  async function addTx() {
    const form = $('#txForm'), btn = $('#txForm button:not([type="button"])');
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const x = {
      date: $('#fDate').value, vendor: $('#fVendor').value.trim(), item: $('#fItem').value,
      type: $('#fType').value, qty: +$('#fQty').value, price: +$('#fPrice').value, status: $('#fPaid').value
    };
    if (x.type === 'resell') x.doNo = $('#fDo').value.trim();
    if (!x.vendor || !(x.qty > 0) || !(x.price >= 0)) { form.reportValidity(); return; }
    if (!gh) { openGh(); return; }
    btn.disabled = true;
    try {
      const row = cleanOne(x, false);
      applyServer(await commit(list => [...list, row]));
      $('#fVendor').value = ''; $('#fDo').value = ''; $('#fQty').value = ''; $('#fPrice').value = ''; $('#fPaid').value = 'pending'; updateTotal();
      toast(t('toast_added'));
    } catch (err) {
      toast(t('err_save') + errText(err));
      if (err.code === 'bad_token' || err.code === 'no_access') { syncErr = err.code; refreshChip(); }
    } finally { btn.disabled = false; }
  }
  async function updateTx(id, patch) {
    if (!gh) { openGh(); renderAll(); return; }
    try {
      applyServer(await commit(list => {
        const i = list.findIndex(x => x.id === id);
        if (i < 0) throw gerr(404, 'not_found', 'Entry not found');
        const row = { ...list[i] };
        if ('status' in patch) { if (patch.status !== 'pending' && patch.status !== 'paid') throw gerr(400, 'bad_status'); row.status = patch.status; }
        if ('doNo' in patch) {
          if (row.type !== 'resell') throw gerr(400, 'bad_do', 'DO number is only for re-sell entries');
          const v = String(patch.doNo == null ? '' : patch.doNo).trim().slice(0, 60);
          if (v) row.doNo = v; else delete row.doNo;
        }
        const out = list.slice(); out[i] = row; return out;
      }));
      toast(t('toast_status'));
    } catch (err) {
      toast(t('err_save') + errText(err));
      if (err.code === 'not_found') refresh(true); else renderAll();   // put the dropdown / box back to what is really saved
    }
  }
  // Handle both the button click and Enter key; also block native submit (some embedded views disallow forms)
  $('#txForm').addEventListener('submit', e => { e.preventDefault(); });
  $('#txForm button:not([type="button"])').addEventListener('click', e => { e.preventDefault(); addTx(); });

  document.addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if (del) askConfirm(t('confirm_del'), t('del'), async () => {
      const id = del.dataset.del;
      try {
        applyServer(await commit(list => {
          if (!list.some(x => x.id === id)) throw gerr(404, 'not_found', 'Entry not found');
          return list.filter(x => x.id !== id);
        }));
        toast(t('toast_deleted'));
      } catch (err) { toast(t('err_save') + errText(err)); if (err.code === 'not_found') refresh(true); }
    });
  });

  $('#btnReset').addEventListener('click', () => {
    if (!session || session.role !== 'admin') return;
    // the admin password is checked here; the dialog stays open on a wrong password
    askConfirm(t('confirm_clear'), t('clear'), async pw => {
      if (!(await verifyAdminPassword(pw))) throw gerr(403, 'bad_password');
      applyServer(await commit(() => []));
      toast(t('toast_cleared'));
    }, true);
  });

  $('#btnExport').addEventListener('click', () => {
    const rows = sorted().map(x => [x.date, x.vendor, x.doNo || '', x.item, x.type === 'purchase' ? t('csv_purchase') : t('csv_resell'),
      x.qty, x.price, total(x).toFixed(2), x.status === 'paid' ? t('csv_paid') : t('csv_pending')]);
    const csv = [t('csv_head'), ...rows].map(r => r.map(c => `"${String(c).replace(/"/g, '""')}"`).join(',')).join('\n');
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(['﻿' + csv], { type: 'text/csv' }));
    a.download = t('csv_file') + today() + '.csv'; a.click(); URL.revokeObjectURL(a.href);
  });

  // ---------- GitHub storage ----------
  // The shared data is data.json in a GitHub repository, read and written through GitHub's API.
  // Every save re-reads the latest file first when someone else changed it, so two people saving at the same moment never overwrite each other.
  const toB64 = str => {
    const b = new TextEncoder().encode(str); let bin = '';
    for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
    return btoa(bin);
  };
  const fromB64 = b64 => new TextDecoder().decode(Uint8Array.from(atob(String(b64).replace(/\s/g, '')), c => c.charCodeAt(0)));
  const gerr = (status, code, message) => Object.assign(new Error(message || code), { status, code });
  const ITEM_KIND = Object.fromEntries(ITEMS.map(i => [i.name, i.kind]));
  function validDate(d) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(d))) return false;
    const x = new Date(d + 'T00:00:00Z');
    return !isNaN(x) && x.toISOString().slice(0, 10) === d;
  }
  const newId = () => Date.now().toString(36).padStart(9, '0') + Math.random().toString(36).slice(2, 8);
  function cleanOne(r, keepId) {
    const bad = m => gerr(400, 'invalid_transaction', m);
    if (!r || typeof r !== 'object') throw bad('Not an object');
    const kind = ITEM_KIND[r.item];
    if (!kind) throw bad('Unknown item');
    if (r.type !== 'purchase' && r.type !== 'resell') throw bad('Unknown type');
    if ((r.type === 'purchase') !== (kind === 'raw')) throw bad('Item does not match type');
    const qty = Number(r.qty), price = Number(r.price);
    if (!Number.isFinite(qty) || qty <= 0 || qty > 1e9) throw bad('Bad quantity');
    if (!Number.isFinite(price) || price < 0 || price > 1e9) throw bad('Bad price');
    if (!validDate(r.date)) throw bad('Bad date');
    const vendor = String(r.vendor == null ? '' : r.vendor).trim().slice(0, 120);
    if (!vendor) throw bad('Vendor is required');
    const row = {
      id: keepId && typeof r.id === 'string' && /^[\w-]{1,40}$/.test(r.id) ? r.id : newId(),
      date: r.date, vendor, item: r.item, type: r.type, qty, price, status: r.status === 'paid' ? 'paid' : 'pending'
    };
    const doNo = String(r.doNo == null ? '' : r.doNo).trim().slice(0, 60);
    if (r.type === 'resell' && doNo) row.doNo = doNo;
    return row;
  }
  function cleanList(arr, keepId) {
    if (!Array.isArray(arr)) throw gerr(400, 'invalid_transaction', 'Expected a list');
    const seen = new Set();
    return arr.map(r => { const row = cleanOne(r, keepId); while (seen.has(row.id)) row.id = newId(); seen.add(row.id); return row; });
  }
  function parseData(text) {
    if (!String(text).trim()) return [];
    let j; try { j = JSON.parse(text); } catch (e) { throw gerr(0, 'bad_file', 'data.json is not valid JSON'); }
    try { return cleanList(Array.isArray(j) ? j : (j.transactions || []), true); }
    catch (e) { throw gerr(0, 'bad_file', e.message); }   // never treat a damaged file as empty: the next save would erase it
  }

  const repoApi = () => 'https://api.github.com/repos/' + gh.repo;
  const filePath = () => (gh.path || 'data.json').replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/');
  async function ghFetch(method, url, body, headers) {
    let res;
    try {
      res = await fetch(url, {
        method, cache: 'no-store',
        headers: Object.assign({ Accept: 'application/vnd.github+json', Authorization: 'Bearer ' + gh.token },
          body !== undefined ? { 'Content-Type': 'application/json' } : {}, headers || {}),
        body: body === undefined ? undefined : JSON.stringify(body)
      });
    } catch (e) { setOnline(false); throw gerr(0, 'network', 'network'); }
    setOnline(true);
    return res;
  }
  async function ghError(res) {
    let j = null; try { j = await res.json(); } catch (e) {}
    const msg = (j && j.message) || 'HTTP ' + res.status;
    let code = 'gh_error';
    if (res.status === 401) code = 'bad_token';
    else if (res.status === 403 || res.status === 429) code = /rate limit/i.test(msg) || res.status === 429 ? 'rate_limit' : 'no_access';
    else if (res.status === 404) code = /ref/i.test(msg) ? 'branch_not_found' : 'repo_not_found';
    return gerr(res.status, code, msg);
  }
  // Returns { tx, sha, etag } (sha null = the file does not exist yet) or { unchanged: true }.
  async function ghRead(ifNoneMatch) {
    const url = repoApi() + '/contents/' + filePath() + (gh.branch ? '?ref=' + encodeURIComponent(gh.branch) : '');
    const res = await ghFetch('GET', url, undefined, ifNoneMatch ? { 'If-None-Match': ifNoneMatch } : undefined);
    if (res.status === 304) return { unchanged: true };
    if (res.status === 404) {
      const e = await ghError(res);
      if (e.code === 'branch_not_found') throw e;
      return { tx: [], sha: null, etag: null };              // no data.json yet: it is created on the first save
    }
    if (!res.ok) throw await ghError(res);
    const j = await res.json();
    if (Array.isArray(j) || j.type === 'dir') throw gerr(0, 'bad_file', 'That path is a folder');
    let text;
    if (j.encoding === 'base64' && j.content != null && j.content !== '') text = fromB64(j.content);
    else {                                                   // files over 1 MB come back without content: ask for the raw file
      const r2 = await ghFetch('GET', url, undefined, { Accept: 'application/vnd.github.raw+json' });
      if (!r2.ok) throw await ghError(r2);
      text = await r2.text();
    }
    return { tx: parseData(text), sha: j.sha, etag: res.headers.get('ETag') };
  }
  async function ghWrite(tx, sha) {
    const body = {
      message: 'Update data (' + (session ? session.username : 'app') + ')',
      content: toB64(JSON.stringify({ app: 'satay-dashboard', version: 2, updatedAt: new Date().toISOString(), transactions: tx }, null, 2) + '\n')
    };
    if (sha) body.sha = sha;
    if (gh.branch) body.branch = gh.branch;
    const res = await ghFetch('PUT', repoApi() + '/contents/' + filePath(), body);
    if (res.status === 409 || res.status === 422) throw gerr(res.status, 'conflict');    // someone saved first (or the file appeared meanwhile)
    if (!res.ok) throw await ghError(res);
    return (await res.json()).content.sha;
  }
  // Apply a change to the latest data and save it. mutator(list) must return the new list (or throw).
  let chain = Promise.resolve(), quietUntil = 0;
  function commit(mutator) {
    const run = chain.then(async () => {
      if (!gh) throw gerr(0, 'not_connected');
      let known = state.rev !== -1 ? { tx: state.tx, sha: state.rev } : null;
      for (let i = 0; i < 5; i++) {
        if (!known) { const r = await ghRead(); known = { tx: r.tx, sha: r.sha }; }
        const next = mutator(known.tx);
        try {
          const sha = await ghWrite(next, known.sha);
          etag = null; quietUntil = Date.now() + 4000;       // don't let an immediate re-read bring back an older copy
          return { transactions: next, rev: sha };
        } catch (e) {
          if (e.code !== 'conflict') throw e;
          known = null; await new Promise(r => setTimeout(r, 250 * (i + 1)));
        }
      }
      throw gerr(409, 'conflict');
    });
    chain = run.catch(() => {});
    return run;
  }
  function applyServer(j) {
    state = { tx: j.transactions, rev: j.rev };
    lsSet(CACHE_KEY, JSON.stringify(state));                 // last-known copy, so the app still shows data offline
    renderAll();
  }
  function setOnline(v) { if (online !== v) { online = v; refreshChip(); } }
  function errText(e) {
    if (e.message === 'nocrypto') return t('no_crypto');
    if (e.code === 'not_found') return t('err_gone');
    if (e.status === 0 && e.code === 'network') return t('err_net');
    const k = { bad_token: 'e_token', no_access: 'e_access', rate_limit: 'e_rate', repo_not_found: 'e_repo', branch_not_found: 'e_branch', bad_file: 'e_file', conflict: 'e_conflict', not_connected: 'sync_none' }[e.code];
    return k ? t(k) : (e.message || t('err_save'));
  }

  // ---------- Live sync ----------
  // Every device checks GitHub every few seconds (an unchanged file costs almost nothing), and right away when you return to the app.
  let renderPending = false, refreshing = false, pollTimer = null, checkedLocal = false;
  function renderSoon() {                                    // don't wipe a DO box someone is typing in
    const a = document.activeElement;
    if (a && a.matches && a.matches('[data-do]')) { renderPending = true; return; }
    renderPending = false; renderAll();
  }
  document.addEventListener('focusout', e => {
    if (renderPending && e.target.matches && e.target.matches('[data-do]')) setTimeout(() => { if (renderPending) renderSoon(); }, 0);
  });
  async function refresh(force) {
    if (!gh || !session || refreshing) return;
    if (!force && Date.now() < quietUntil) return;
    refreshing = true;
    try {
      const r = await ghRead(!force && etag ? etag : null);
      if (syncErr) { syncErr = ''; refreshChip(); }
      if (!r.unchanged) {
        etag = r.etag;
        if (force || r.sha !== state.rev) {
          state = { tx: r.tx, rev: r.sha };
          lsSet(CACHE_KEY, JSON.stringify(state));
          renderSoon();
        }
      }
      if (!checkedLocal) { checkedLocal = true; offerLocalUpload(); }
    } catch (e) {
      if (e.code !== 'network') { syncErr = e.code || 'error'; refreshChip(); }   // offline just keeps showing the last data
    } finally { refreshing = false; }
  }
  function startSync() {
    stopSync(); checkedLocal = false; etag = null;
    refresh(true);
    pollTimer = setInterval(() => { if (!document.hidden) refresh(); }, POLL_MS);
  }
  function stopSync() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });
  window.addEventListener('online', () => refresh());
  window.addEventListener('offline', () => setOnline(false));

  // Entries made before the shared data existed live only in this browser: offer to upload them once.
  function offerLocalUpload() {
    if (state.tx.length || lsGet(MIGRATED_KEY)) return;
    let old = [];
    try { old = (JSON.parse(lsGet(OLD_KEY)) || {}).tx || []; } catch (e) {}
    if (!old.length) return;
    askConfirm(t('upload_local')(old.length), t('upload'), async () => {
      try {
        const rows = cleanList(old, false);
        applyServer(await commit(list => { if (list.length) throw gerr(409, 'not_empty'); return rows; }));
        lsSet(MIGRATED_KEY, '1'); toast(t('toast_uploaded'));
      } catch (err) { if (err.code === 'not_empty') lsSet(MIGRATED_KEY, '1'); toast(t('err_save') + errText(err)); }
    }, false, () => lsSet(MIGRATED_KEY, '1'));
  }

  // ---------- Connect to GitHub (once per device) ----------
  async function loadDefaults() {                            // config.json (no secrets) can pre-fill the repository for everyone
    try {
      const r = await fetch('config.json', { cache: 'no-cache' });
      if (r.ok) { const j = await r.json(); for (const k of ['repo', 'branch', 'path']) if (typeof j[k] === 'string' && j[k].trim()) ghDefaults[k] = j[k].trim(); }
    } catch (e) {}
    if (!ghDefaults.repo && /\.github\.io$/i.test(location.hostname)) {   // running on GitHub Pages: guess owner/repo from the web address
      const seg = location.pathname.split('/')[1] || '';
      ghDefaults.repo = location.hostname.split('.')[0] + '/' + (seg && !/\.\w+$/.test(seg) ? seg : location.hostname);
    }
  }
  function loadGh() {
    try { const c = JSON.parse(lsGet(GH_KEY)); if (c && c.repo && c.token) return c; } catch (e) {}
    return null;
  }
  function ghMsg(msg) { const e = $('#ghErr'); e.textContent = msg || ''; e.style.display = msg ? 'block' : 'none'; }
  function openGh(msg) {
    const c = gh || {};
    $('#ghRepo').value = c.repo || ghDefaults.repo || '';
    $('#ghBranch').value = c.branch != null ? c.branch : (ghDefaults.branch || '');
    $('#ghPath').value = c.path || ghDefaults.path || 'data.json';
    $('#ghToken').value = '';
    $('#ghToken').placeholder = c.token ? '••••••••  (leave empty to keep the saved token)' : 'github_pat_...';
    $('#ghOff').style.display = gh ? '' : 'none';
    ghMsg(msg); $('#ghModal').style.display = 'flex';
    ($('#ghRepo').value ? $('#ghToken') : $('#ghRepo')).focus();
  }
  function closeGh() { $('#ghModal').style.display = 'none'; $('#ghToken').value = ''; ghMsg(''); }
  async function saveGh() {
    const repo = $('#ghRepo').value.trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/\/+$/, '');
    const token = $('#ghToken').value.trim() || (gh && gh.token) || '';
    const cfg = { repo, token, branch: $('#ghBranch').value.trim(), path: ($('#ghPath').value.trim() || 'data.json').replace(/^\/+/, '') };
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo) || !token) return ghMsg(t('e_need'));
    const btn = $('#ghSave'); btn.disabled = true; ghMsg('');
    const prev = gh; gh = cfg;
    try {
      const rr = await ghFetch('GET', repoApi());              // is the repository reachable with this token?
      if (!rr.ok) throw await ghError(rr);
      const r = await ghRead();                                // can the data file be read (or does it not exist yet)?
      lsSet(GH_KEY, JSON.stringify(cfg));
      state = { tx: r.tx, rev: r.sha }; etag = r.etag; syncErr = '';
      lsSet(CACHE_KEY, JSON.stringify(state));
      closeGh(); renderAll(); refreshChip(); startSync(); toast(t('toast_connected'));
    } catch (e) {
      gh = prev; ghMsg(errText(e));
    } finally { btn.disabled = false; }
  }
  function disconnectGh() {
    stopSync(); gh = null; etag = null; syncErr = '';
    lsDel(GH_KEY); lsDel(CACHE_KEY); state = { tx: [], rev: -1 };
    closeGh(); renderAll(); refreshChip(); toast(t('toast_disconnected'));
  }
  $('#syncChip').addEventListener('click', () => openGh(gh && syncErr ? errText({ code: syncErr }) : ''));
  $('#ghSave').addEventListener('click', saveGh);
  $('#ghClose').addEventListener('click', closeGh);
  $('#ghOff').addEventListener('click', disconnectGh);
  $('#ghModal').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('input')) { e.preventDefault(); saveGh(); } else if (e.key === 'Escape') closeGh(); });

  // ---------- Sign in ----------
  // Passwords are checked in the browser against users.json (SHA-256 of "<username lowercase>:<password>").
  // This is a convenience gate for a static site, not real security: anyone who can open the site can read users.json.
  async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
  }
  async function loadUsers() {
    const r = await fetch('users.json', { cache: 'no-cache' });
    if (!r.ok) throw gerr(r.status, 'users_unreadable');
    const j = await r.json();
    return Array.isArray(j) ? j : (j.users || []);
  }
  const userInfo = u => ({ username: u.username, name: u.name || u.username, role: u.role === 'admin' ? 'admin' : 'staff' });
  async function verifyAdminPassword(pw) {
    if (!session || session.role !== 'admin' || !pw) return false;
    if (!(window.crypto && crypto.subtle)) throw new Error('nocrypto');
    const users = await loadUsers();
    const u = users.find(x => String(x.username).toLowerCase() === session.username.toLowerCase() && x.role === 'admin' && x.active !== false);
    return !!u && u.passwordHash === await sha256(session.username.toLowerCase() + ':' + pw);
  }
  function refreshChip() {
    $('#userChip').textContent = session ? `${session.name} · ${t(session.role === 'admin' ? 'role_admin' : 'role_staff')}` : '';
    const c = $('#syncChip');
    c.style.display = session ? '' : 'none';
    let key = 'sync_ok', dot = '● ', bad = false;
    if (!gh) { key = 'sync_none'; dot = '! '; bad = true; }
    else if (syncErr) { key = 'sync_err'; dot = '! '; bad = true; }
    else if (!online) { key = 'sync_off'; dot = '○ '; bad = true; }
    c.textContent = dot + t(key);
    c.className = 'text-xs px-2 py-1 rounded-full ' + (bad ? 'bg-rose-600 text-white' : 'bg-white/15 text-amber-50');
  }
  function setSession(sess) {
    session = sess;
    document.body.dataset.role = sess ? sess.role : '';
    $('#login').style.display = sess ? 'none' : 'flex';
    refreshChip();
  }
  function logout() {
    stopSync();
    lsDel(SESSION_KEY); lsDel(CACHE_KEY);                     // don't leave the data on a shared device (the GitHub connection stays)
    state = { tx: [], rev: -1 }; etag = null; syncErr = '';
    setSession(null); renderAll();
    if (pendingConfirm) closeConfirm();
    closeGh();
  }
  function afterSignIn() {
    gh = loadGh();
    refreshChip();
    if (gh) startSync(); else openGh();
  }
  async function doLogin() {
    const err = $('#loginErr'); err.style.display = 'none';
    const showErr = k => { err.textContent = t(k); err.style.display = 'block'; };
    const u = $('#lUser').value.trim(), p = $('#lPass').value;
    if (!u || !p) return showErr('login_err');
    $('#loginBtn').disabled = true;
    try {
      if (!(window.crypto && crypto.subtle)) throw new Error('nocrypto');
      const users = await loadUsers();
      const h = await sha256(u.toLowerCase() + ':' + p);
      const found = users.find(x => String(x.username).toLowerCase() === u.toLowerCase() && x.passwordHash === h && x.active !== false);
      if (!found) return showErr('login_err');
      const sess = userInfo(found);
      lsSet(SESSION_KEY, JSON.stringify(sess));
      $('#lPass').value = '';
      setSession(sess); afterSignIn();
    } catch (e) {
      showErr(e.message === 'nocrypto' ? 'no_crypto' : 'login_load_err');
    } finally { $('#loginBtn').disabled = false; }
  }
  function restoreSession() {
    let sess = null; try { sess = JSON.parse(lsGet(SESSION_KEY)); } catch (e) {}
    if (!sess || !sess.username) return setSession(null);
    setSession(sess);
    try { const c = JSON.parse(lsGet(CACHE_KEY)); if (c && Array.isArray(c.tx)) { state = { tx: c.tx, rev: -1 }; renderAll(); } } catch (e) {}
    afterSignIn();
    // re-check against users.json when reachable (removes deactivated users, refreshes role and name)
    loadUsers().then(users => {
      const u = users.find(x => String(x.username).toLowerCase() === String(sess.username).toLowerCase() && x.active !== false);
      if (!u) return logout();
      const fresh = userInfo(u); lsSet(SESSION_KEY, JSON.stringify(fresh)); setSession(fresh);
    }).catch(() => {});
  }
  $('#loginForm').addEventListener('submit', e => e.preventDefault());
  $('#loginBtn').addEventListener('click', e => { e.preventDefault(); doLogin(); });
  $('#btnLogout').addEventListener('click', logout);

  // ---------- Install app ----------
  // Android / desktop Chrome can install straight from the button; iPhone Safari (and chat-app browsers) need the steps shown in the dialog.
  let installEvt = null;
  const standalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const UA = navigator.userAgent || '';
  const isIOS = /iphone|ipad|ipod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const isAndroid = /android/i.test(UA);
  function refreshInstall() {
    const show = !standalone();
    $('#btnInstall').style.display = show ? '' : 'none';
    $('#loginInstall').style.display = show ? '' : 'none';
  }
  function openInstallHelp() {
    const li = k => `<p>${esc(t(k))}</p>`;
    const first = isIOS ? 'inst_ios' : isAndroid ? 'inst_android' : 'inst_desktop';
    const rest = ['inst_ios', 'inst_android', 'inst_desktop'].filter(k => k !== first);
    $('#installBody').innerHTML =
      `<div class="rounded-lg bg-amber-50 border border-amber-200 p-3 font-medium">${esc(t(first))}</div>` +
      `<div class="rounded-lg bg-rose-50 border border-rose-200 p-3 text-rose-800">${esc(t('inst_inapp'))}</div>` +
      rest.map(li).join('') + `<p class="text-stone-500">${esc(t('inst_after'))}</p>`;
    $('#installModal').style.display = 'flex';
  }
  async function installApp() {
    if (installEvt) {
      const e = installEvt; installEvt = null;
      try { e.prompt(); const c = await e.userChoice; if (c && c.outcome === 'accepted') return; } catch (err) {}
    }
    openInstallHelp();
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; });
  window.addEventListener('appinstalled', () => { installEvt = null; refreshInstall(); });
  $('#btnInstall').addEventListener('click', installApp);
  $('#loginInstall').addEventListener('click', installApp);
  $('#installClose').addEventListener('click', () => { $('#installModal').style.display = 'none'; });
  $('#installModal').addEventListener('click', e => { if (e.target.id === 'installModal') $('#installModal').style.display = 'none'; });

  function registerSW() {
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('service-worker.js').catch(() => {});
    }
  }

  // ---------- Init ----------
  $('#fDate').value = today();
  applyLang(); setTab('overview');
  refreshInstall();
  loadDefaults().finally(restoreSession); registerSW();
})();
</script>
</body>
</html>
